name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F'.' '{print $1}')
          if [ "$JAVA_VERSION" = "1" ]; then
            JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F'.' '{print $2}')
          fi
          echo "Detected Java major version: $JAVA_VERSION"
          if [ -z "$JAVA_VERSION" ] || [ "$JAVA_VERSION" -lt 17 ]; then
            echo "Error: Java version 17 or newer is required, but found version '$JAVA_VERSION'."
            exit 1
          fi
          echo "Java version verification passed."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f ./debug.keystore ]; then
            echo "Error: debug.keystore was not created successfully."
            exit 1
          fi
          echo "Temporary debug keystore verified at ./debug.keystore"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK existence
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Expected debug APK not found at $APK_PATH"
            echo "Searching inside app/build/outputs/apk:"
            find app/build/outputs/apk -type f 2>/dev/null || true
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: APK file is empty: $APK_PATH"
            exit 1
          fi
          echo "APK verified successfully at $APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          mkdir -p ./release_asset
          REPO_NAME=$(basename "${{ github.repository }}")
          SAFE_REPO_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/_/g')
          RUN_NUM="${{ github.run_number }}"
          ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${RUN_NUM}.apk"
          DEST_PATH="./release_asset/$ASSET_NAME"
          cp app/build/outputs/apk/debug/app-debug.apk "$DEST_PATH"
          
          if [ ! -f "$DEST_PATH" ] || [ ! -s "$DEST_PATH" ]; then
            echo "Error: Prepared release asset is missing or empty."
            exit 1
          fi
          
          echo "asset_path=$DEST_PATH" >> $GITHUB_OUTPUT
          echo "asset_name=$ASSET_NAME" >> $GITHUB_OUTPUT
          echo "Prepared release asset: $DEST_PATH"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset not found for publishing."
            exit 1
          fi
          
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          COMMIT_SHA="${{ github.sha }}"
          
          RELEASE_NOTES=$(cat <<EOF
          This is an automatically generated debug APK.
          - Built by: GitHub Actions
          - Run Number: ${{ github.run_number }}
          - Run Attempt: ${{ github.run_attempt }}
          - Source Commit: $COMMIT_SHA
          - Intended Use: Testing and evaluation
          - Note: Not a Play Store production release; signed with a temporary debug keystore.
          EOF
          )
          
          echo "Creating release $TAG_NAME for commit $COMMIT_SHA..."
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "$COMMIT_SHA" \
            --latest \
            --notes "$RELEASE_NOTES"
          
          echo "Release published successfully."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SUCCESS="${{ steps.publish_release.outcome }}"
          RUN_NUM="${{ github.run_number }}"
          
          if [ "$SUCCESS" = "success" ]; then
            TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "=== GITHUB RELEASE PUBLISHED SUCCESSFULLY ==="
            gh release view "$TAG_NAME" || true
            
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME"
            echo "Release URL: $RELEASE_URL"
            
            {
              echo "### 🚀 ZOYA Debug APK Release Successful!"
              echo "The debug APK has been successfully built and published to GitHub Releases."
              echo "- **Release Tag:** \`$TAG_NAME\`"
              echo "- **Direct Release Page:** [View Release]($RELEASE_URL)"
              echo "- **Artifact Backup:** The normal GitHub Actions artifact \`app-debug-apk\` is also available."
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "=== WARNING: GITHUB RELEASE PUBLISHING FAILED ==="
            echo "The APK build and Actions artifact upload succeeded, but release publishing failed."
            
            {
              echo "### ⚠️ ZOYA Debug APK Build Succeeded (Release Publishing Failed)"
              echo "The debug APK was built successfully and uploaded to GitHub Actions artifacts as \`app-debug-apk\`, but automatic GitHub Release publishing encountered an error."
              echo "- You can download the APK directly from the **Actions** tab of this workflow run under artifacts."
            } >> $GITHUB_STEP_SUMMARY
          fi
